<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - TechNova Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="forgot-password.css"
    >

</head>


<body>


<div class="auth-page">


    <div class="auth-container">


        <div class="auth-logo">
            🛍️ TechNova
        </div>


        <!-- ==============================================
             FORGOT PASSWORD
        =============================================== -->

        <div id="forgotStep">


            <h1>
                Forgot Password?
            </h1>


            <p>
                Enter your registered email address and
                we will send you a verification code.
            </p>


            <form id="forgotPasswordForm">


                <div class="input-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                    id="sendCodeBtn"
                >
                    Send Verification Code
                </button>


            </form>


            <div
                id="forgotMessage"
                class="auth-message"
            ></div>


        </div>


        <!-- ==============================================
             VERIFY OTP
        =============================================== -->

        <div
            id="verifyStep"
            style="display:none;"
        >


            <h1>
                Verify Your Email
            </h1>


            <p>
                Enter the 6-digit verification code
                sent to your email.
            </p>


            <form id="verifyOtpForm">


                <div class="input-group">

                    <label for="otpInput">
                        Verification Code
                    </label>

                    <input
                        type="text"
                        id="otpInput"
                        maxlength="6"
                        inputmode="numeric"
                        placeholder="Enter 6-digit code"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Verify Code
                </button>


            </form>


            <div
                id="otpMessage"
                class="auth-message"
            ></div>


        </div>


        <!-- ==============================================
             RESET PASSWORD
        =============================================== -->

        <div
            id="resetStep"
            style="display:none;"
        >


            <h1>
                Create New Password
            </h1>


            <p>
                Enter your new password below.
            </p>


            <form id="resetPasswordForm">


                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmNewPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Reset Password
                </button>


            </form>


            <div
                id="resetMessage"
                class="auth-message"
            ></div>


        </div>


        <a
            href="login.html"
            class="back-login"
        >
            ← Back to Login
        </a>


    </div>


</div>


<!-- EmailJS -->

<script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
></script>


<script src="forgot-password.js"></script>


</body>

</html>
