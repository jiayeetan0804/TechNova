<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - TechNova Store</title>

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="login-logo">

            💻

        </div>


        <h1>
            Create Account
        </h1>


        <p class="login-subtitle">

            Join TechNova Store today

        </p>


        <form id="registerForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >

                Create Account

            </button>


        </form>


        <p
            id="registerMessage"
            class="login-message"
        ></p>


        <div class="register-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <a
            href="index.html"
            class="back-home"
        >

            ← Back to Store

        </a>


    </div>


</div>


<script src="login.js"></script>
<script src="script.js"></script>


</body>

</html>
