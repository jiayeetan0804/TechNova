<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Wishlist - TechNova Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="wishlist.css"
    >

</head>


<body>


<!-- ==================================================
     NAVBAR
================================================== -->

<header class="navbar">

    <div class="logo">
        🛍️ TechNova
    </div>


    <nav>

        <a href="index.html#home">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>


    <div class="nav-right">

        <a
            href="index.html#products"
            class="wishlist-back"
        >
            Continue Shopping
        </a>

    </div>

</header>



<!-- ==================================================
     WISHLIST PAGE
================================================== -->

<main class="wishlist-page">


    <!-- HEADER -->

    <section class="wishlist-header">

        <p>
            TECHNOVA STORE
        </p>

        <h1>
            ❤️ My Wishlist
        </h1>

        <span id="wishlistCount">
            0 Products
        </span>

    </section>



    <!-- WISHLIST PRODUCTS -->

    <section
        class="wishlist-container"
        id="wishlistContainer"
    >
    </section>



    <!-- EMPTY WISHLIST -->

    <section
        class="wishlist-empty"
        id="wishlistEmpty"
    >

        <div class="wishlist-empty-icon">
            ♡
        </div>

        <h2>
            Your Wishlist is Empty
        </h2>

        <p>
            Save your favourite products here
            and come back to them later.
        </p>

        <a
            href="index.html#products"
            class="wishlist-shop-btn"
        >
            Browse Products →
        </a>

    </section>


</main>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script src="script.js"></script>

<script src="wishlist.js"></script>


</body>

</html>
