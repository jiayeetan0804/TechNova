<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - TechNova Store</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


<!-- ==================================================
     LOGIN PAGE
================================================== -->

<div class="login-page">


    <!-- BACK TO STORE -->

    <a
        href="index.html"
        class="store-link"
    >
        ← Back to TechNova Store
    </a>


    <!-- LOGIN CARD -->

    <div class="login-card">


        <!-- BRAND -->

        <div class="login-brand">

            <div class="brand-icon">
                💻
            </div>

            <span>
                TechNova Store
            </span>

        </div>


        <!-- HEADING -->

        <div class="login-heading">

            <h1>
                Welcome Back
            </h1>

            <p>
                Sign in to continue to your account.
            </p>

        </div>


        <!-- FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <div class="password-label">

                    <label for="loginPassword">
                        Password
                    </label>

                </div>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <a href="forgot-password.html" class="forgot-password-link">
                    
                    <span>
                    Forgot Password?
                    </span>

                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >

                <span>
                    Login
                </span>

                <span class="login-arrow">
                    →
                </span>

            </button>


        </form>


        <!-- MESSAGE -->

        <p
            id="loginMessage"
            class="login-message"
        ></p>


        <!-- REGISTER -->

        <div class="register-area">

            <span>
                Don't have an account?
            </span>

            <a href="register.html">
                Create Account
            </a>

        </div>


    </div>


    <!-- FOOTER TEXT -->

    <div class="login-footer">

        <span>
            © 2026 TechNova Store
        </span>

        <span class="footer-dot">
            •
        </span>

        <span>
            Technology Made Simple.
        </span>

    </div>


</div>


<script src="login.js"></script>
<script src="script.js"></script>

</body>

</html>
